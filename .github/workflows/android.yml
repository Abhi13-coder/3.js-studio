name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install API 36 platform & build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Sync engine assets into Android assets
        run: |
          mkdir -p 3js-studio/android/app/src/main/assets/js
          cp -f 3js-studio/index.html 3js-studio/android/app/src/main/assets/
          cp -f 3js-studio/js/*.js 3js-studio/android/app/src/main/assets/js/

      - name: Build debug APK
        working-directory: 3js-studio/android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3js-studio-debug
          path: 3js-studio/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

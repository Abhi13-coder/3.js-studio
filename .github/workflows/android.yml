name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        # v4 no longer installs the removed "tools" package

      - name: Install API 36 platform & build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          # licenses are already accepted by setup-android@v4

      - name: Make gradlew executable (generate if missing)
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      - name: Sync engine assets into Android assets
        run: |
          mkdir -p android/app/src/main/assets/js
          cp -f index.html android/app/src/main/assets/
          cp -f js/*.js android/app/src/main/assets/js/

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3js-studio-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
